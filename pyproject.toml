    "google-auth-oauthlib>=1.4.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]
